<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visual DSA learning roadmap with connected topics and progress tracking">
  <title>DSA Visual Roadmap - Connected Learning Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header class="header">
    <div class="header-content">
      <div class="logo">DSA Mastery</div>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="roadmap.html" class="active">Visual Roadmap</a>

    <section class="hero">
